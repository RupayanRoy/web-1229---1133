<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Student Management System</title>
    <link rel="stylesheet" href="universal.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-page">

<header>
    <h2>Student Management System</h2>
</header>

<div class="auth-container">
    <div class="card auth-card">
        <div class="auth-header">
            <h3>🔑 Recover Account</h3>
            <p>Enter your username to receive a security OTP.</p>
        </div>

        <div class="form-group">
            <label for="username">Registered Username</label>
            <input type="text" id="username" placeholder="Enter your username" required>
            
            <p id="otpInfo" style="font-size: 0.8rem; color: #64748b; margin-top: 10px;"></p>

            <button class="btn reset-btn" onclick="sendOTP()">Send Security OTP</button>
        </div>

        <div class="auth-footer">
            <p>Suddenly remembered? <a href="login.html">Back to Login</a></p>
        </div>
    </div>
</div>

<div class="credit-bar">
    <div class="credit-track">
        <span>🚀 This website is developed by <b>Rupayan Roy</b> &nbsp;|&nbsp; 🎨 Designed by <b>Monalisa Das</b> &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; • &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; 🚀 This website is developed by <b>Rupayan Roy</b> &nbsp;|&nbsp; 🎨 Designed by <b>Monalisa Das</b></span>
    </div>
</div>

<script>
function sendOTP() {
    const username = document.getElementById("username").value;

    if (!username) {
        alert("Please enter your username to proceed.");
        return;
    }

    fetch("http://localhost:3000/api/forgot-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username })
    })
    .then(res => res.json())
    .then(data => {
        if (!data.success) {
            alert(data.message);
            return;
        }

        // ✅ ALERT SHOWS OTP FOR DEMO
        alert("Your OTP (demo): " + data.otp);

        // Save username for the reset page
        localStorage.setItem("resetUser", username);

        // Redirect to reset.html
        window.location.href = "reset.html";
    })
    .catch(err => {
        alert("Server connection failed. Please try again.");
        console.error(err);
    });
}
</script>

<style>
/* Centering logic to prevent horizontal clumping */
.auth-page {
    background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
}

.auth-container {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.auth-card {
    width: 100%;
    max-width: 400px;
    padding: 40px;
    background: white;
    border-radius: 24px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.05); /* Soft, professional shadow */
}

.form-group label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    color: #475569;
    margin-bottom: 8px;
}

.form-group input {
    width: 100%;
    padding: 12px 16px;
    border-radius: 12px;
    border: 1px solid #e2e8f0;
    background: #f8fafc;
    font-size: 1rem;
    transition: 0.2s;
}

.form-group input:focus {
    outline: none;
    border-color: #6366f1;
    box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
}

.reset-btn {
    width: 100%;
    background: #6366f1;
    color: white;
    margin-top: 25px;
    padding: 14px;
    border-radius: 12px;
    font-weight: 700;
    border: none;
    cursor: pointer;
    transition: 0.3s;
}

.reset-btn:hover {
    background: #4f46e5;
    transform: translateY(-2px);
    box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.3);
}

.auth-footer {
    text-align: center;
    margin-top: 25px;
    font-size: 0.9rem;
}

.auth-footer a {
    color: #6366f1;
    font-weight: 600;
    text-decoration: none;
}
</style>

</body>
</html>
